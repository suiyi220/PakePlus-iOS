<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页版答题系统</title>
    <!-- 引入 SheetJS 用于处理 Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <!-- KaTeX 样式：多 CDN 依次兜底，任一可用即可正常显示公式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" onerror="this.onerror=null;this.href='https://unpkg.com/katex@0.16.9/dist/katex.min.css';" />
    <!-- KaTeX 脚本：由下方加载器按多个 CDN 依次尝试，避免单一源不可达导致公式不渲染 -->
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 上传区域 */
        .upload-section {
            text-align: center;
            padding: 50px;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        input[type="file"] {
            display: none;
        }

        .upload-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-block;
        }

        .upload-btn:hover {
            background-color: #357abd;
        }

        /* 答题区域 */
        .quiz-section {
            display: none; /* 初始隐藏 */
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .tag-type { background: #e1f0ff; color: var(--primary-color); }
        .tag-wrong { background: #fdecea; color: var(--error-color); display: none; }
        .tag-fav { background: #fff8e1; color: #f1c40f; display: none; }

        /* 顶部导航条：固定在题目正上方，位置不随题目长度变化 */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            height: 52px;
            box-sizing: border-box;
        }

        .nav-controls .btn {
            flex: 0 1 30%;
            margin: 0;
        }

        .nav-hint {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* 题号进度 + 浮窗 */
        .progress-wrap {
            position: relative;
        }

        #progressText {
            cursor: pointer;
            user-select: none;
            padding: 6px 10px;
            border-radius: 5px;
            border: 1px dashed transparent;
            font-weight: 600;
        }

        #progressText:hover {
            background: #eef6fc;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        #navPopover {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 99;
            margin-top: 8px;
            width: 320px;
            max-height: 340px;
            overflow-y: auto;
            padding: 12px;
            background: #fff;
            border: 1px solid #e2e6ea;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        #navPopover.show { display: block; }

        .popover-title {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .legend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #888;
        }

        .legend i {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            display: inline-block;
            border: 1px solid #ccc;
        }

        .legend i.ok { border-color: var(--success-color); background: var(--success-color); }
        .legend i.bad { border-color: var(--error-color); background: var(--error-color); }
        .legend i.todo { border-color: #bbb; background: transparent; }

        .num-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 8px;
        }

        .num-cell {
            height: 34px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: transparent;
            color: #555;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .num-cell:hover { transform: scale(1.08); }

        .num-cell.correct {
            border-color: var(--success-color);
            background: var(--success-color);
            color: #fff;
        }

        .num-cell.wrong {
            border-color: var(--error-color);
            background: var(--error-color);
            color: #fff;
        }

        .num-cell.current {
            outline: 2px solid var(--primary-color);
            outline-offset: 1px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .num-cell.correct.current,
        .num-cell.wrong.current { color: #fff; }

        /* 题干：固定高度，切换题目时页面高度不跳动 */
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin: 18px 0 20px;
            line-height: 1.5;
            height: 120px;
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #eef0f3;
            border-radius: 8px;
            background: #fbfcfe;
        }

        /* 选项区：同样固定高度，保证整体卡片高度稳定 */
        .options-list {
            list-style: none;
            padding: 0 4px 0 0;
            margin: 0;
            height: 300px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .option-item {
            margin-bottom: 12px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            background: #fff;
        }

        .option-item:hover {
            background-color: #f9f9f9;
            border-color: #bbb;
        }

        .option-item.selected {
            border-color: var(--primary-color);
            background-color: #eef6fc;
        }

        /* 答对：绿色；答错：错选红、正确绿 */
        .option-item.correct {
            border-color: var(--success-color) !important;
            background-color: #eafaf1 !important;
            color: #1e8449;
            font-weight: 600;
        }

        .option-item.wrong {
            border-color: var(--error-color) !important;
            background-color: #fdecea !important;
            color: #c0392b;
            font-weight: 600;
        }

        .option-item.locked {
            cursor: default;
        }

        .option-item input {
            margin-right: 12px;
            transform: scale(1.2);
        }

        /* 底部操作栏 */
        .action-bar {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            flex: 1;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-outline { background: transparent; border: 1px solid #ccc; color: #555; }
        .btn-outline.active { border-color: #f1c40f; color: #f1c40f; background: #fffdf0; }
        .btn-export { background: #27ae60; color: white; }

        /* 顶部工具条：导入题库 / 导出笔记题库 */
        .top-tools {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        .top-tools .btn {
            flex: 0 0 auto;
            padding: 8px 14px;
            font-size: 13px;
        }

        .btn-import { background: #e67e22; color: white; }

                /* 解析与笔记 */
        .analysis-box {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            display: none;
        }

        .analysis-box.show { display: block; }

        textarea.note-editor {
            width: 100%;
            height: 80px;
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            font-family: inherit;
            box-sizing: border-box;
        }

        .preview-label {
            margin-top: 12px;
            font-size: 13px;
            color: #666;
        }

        .note-preview {
            margin-top: 6px;
            padding: 12px;
            background: #fff;
            border: 1px dashed #cfd8e3;
            border-radius: 4px;
            line-height: 1.9;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
            font-size: 15px;
        }

        .note-preview:empty { display: none; }

        .note-preview .katex { font-size: 1.08em; }

        .note-preview .math-error { color: #c0392b; }

        /* 独立成行的公式（$$...$$ / \[...\]）居中显示，留出行间距 */
        .note-preview .katex-display { margin: 10px 0; text-align: center; }

        /* 题干、选项、正确答案中的公式同样适配 */
        #questionText .katex, .option-item .katex, #correctAnswerDisplay .katex { font-size: 1.06em; }

        .formula-tip { margin-top: 8px; font-size: 12px; color: #b0392b; }
        .formula-tip:empty { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- 上传界面 -->
    <div id="uploadSection" class="upload-section">
        <h2>在线答题系统</h2>
        <p>请上传 Excel 题库文件 (.xlsx, .xls)</p>
        <p style="font-size: 12px; color: #666;">
            表头需包含：题型、题干、选项A、选项B...、答案、解析<br>题干、选项、答案、解析/笔记中的 LaTeX 公式（$...$、$$...$$、\(...\)、\[...\]）都会自动渲染<br>
            判断题无需填写选项，只写答案（正确 / 错误 / 对 / 错 / 对. / √ / × / T / F）即可自动生成选项
        </p>
        <label for="fileInput" class="upload-btn">选择文件</label>
        <input type="file" id="fileInput" accept=".xlsx, .xls" />
    </div>

    <!-- 答题界面 -->
    <div id="quizSection" class="quiz-section">
        <div class="card">
            <!-- 顶部工具条：导入题库 / 导出笔记题库 -->
            <div class="top-tools">
                <button id="btnImport" class="btn btn-import">导入题库</button>
                <button id="btnExportTop" class="btn btn-export">导出笔记题库</button>
                <input type="file" id="importInput" accept=".xlsx, .xls" />
            </div>

            <div class="header-bar">
                <div class="progress-wrap">
                    <span id="progressText" title="点击选择题号">第 1 / 1 题</span>
                    <div id="navPopover">
                        <div class="popover-title">
                            <span>选择题号</span>
                            <span class="legend"><i class="ok"></i>已做对</span>
                            <span class="legend"><i class="bad"></i>做错</span>
                            <span class="legend"><i class="todo"></i>未做</span>
                        </div>
                        <div id="numGrid" class="num-grid"></div>
                    </div>
                </div>
                <div>
                    <span id="tagType" class="tag tag-type">单选题</span>
                    <span id="tagWrong" class="tag tag-wrong">错题</span>
                    <span id="tagFav" class="tag tag-fav">已收藏</span>
                </div>
            </div>

            <div id="questionText" class="question-text">题目加载中...</div>

            <ul id="optionsList" class="options-list">
                <!-- 选项将通过 JS 渲染 -->
            </ul>

            <!-- 上一题 / 下一题：显示在题目下方 -->
            <div class="nav-controls" style="margin-top: 20px;">
                <button id="btnPrev" class="btn btn-outline">上一题 (← ↑)</button>
                <span class="nav-hint">键盘 ← ↑ 上一题，→ ↓ / 空格 下一题（多选先提交）</span>
                <button id="btnNext" class="btn btn-outline">下一题 (→ ↓)</button>
            </div>

            <div class="action-bar">
                <button id="btnSubmit" class="btn btn-primary">提交答案</button>
                <button id="btnFav" class="btn btn-outline">收藏</button>
            </div>

            <div id="analysisBox" class="analysis-box">
                <div><strong>正确答案：</strong> <span id="correctAnswerDisplay" style="color: var(--success-color); font-weight: bold;"></span></div>
                <div style="margin-top: 10px;"><strong>解析/笔记：</strong></div>
                <textarea id="noteInput" class="note-editor" placeholder="在此处输入解析或笔记...（支持 LaTeX 公式，如 $x^2$ 或 $$\int_0^1 x\,dx$$）"></textarea>
                <div class="preview-label"><strong>笔记预览</strong>（公式自动渲染）</div>
                <div id="notePreview" class="note-preview"></div>
                <div id="formulaTip" class="formula-tip"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== 全局变量 =====
    let questionData = [];
    let currentIndex = 0;
    let userAnswers = {};      // { index: ['A','B'] }
    let userNotes = {};        // { index: "note text" }
    let favorites = new Set(); // 收藏索引
    let wrongQuestions = new Set();   // 错题索引
    let correctQuestions = new Set(); // 已做且正确的索引

    const OPTION_KEYS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

    // DOM
    const uploadSection = document.getElementById('uploadSection');
    const quizSection = document.getElementById('quizSection');
    const fileInput = document.getElementById('fileInput');
    const progressText = document.getElementById('progressText');
    const navPopover = document.getElementById('navPopover');
    const numGrid = document.getElementById('numGrid');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');

    fileInput.addEventListener('change', handleFileUpload);

    // 顶部「导入题库」按钮：选择文件后交给同一个加载器
    const importInput = document.getElementById('importInput');
    document.getElementById('btnImport').addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        importInput.click();
    });
    importInput.addEventListener('change', (e) => {
        handleImportFile(e);
        // 允许连续导入同一个文件
        importInput.value = '';
    });

    function readExcelFile(file, callback) {
        const reader = new FileReader();
        reader.onload = function(ev) {
            const data = new Uint8Array(ev.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            callback(XLSX.utils.sheet_to_json(worksheet));
        };
        reader.onerror = function() { alert('文件读取失败，请重试'); };
        reader.readAsArrayBuffer(file);
    }

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        readExcelFile(file, function(jsonData) {
            if (jsonData.length > 0) {
                loadQuestionBank(jsonData);
                uploadSection.style.display = 'none';
                quizSection.style.display = 'block';
            } else {
                alert('文件内容为空或格式不正确');
            }
        });
    }

    // 导入题库：可导入原始题库，也可导入之前导出的「笔记题库」以还原解析与做题记录
    function handleImportFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        readExcelFile(file, function(jsonData) {
            if (!jsonData.length) { alert('文件内容为空或格式不正确'); return; }
            if (!('题干' in jsonData[0]) && !('题目' in jsonData[0])) {
                alert('未识别到「题干」列，请选择题库格式的 Excel 文件');
                return;
            }
            loadQuestionBank(jsonData);
            uploadSection.style.display = 'none';
            quizSection.style.display = 'block';
        });
    }

    // 载入题库并还原笔记 / 收藏 / 错题 / 答题状态
    function loadQuestionBank(jsonData) {
        userAnswers = {};
        userNotes = {};
        favorites = new Set();
        wrongQuestions = new Set();
        correctQuestions = new Set();
        processQuestionData(jsonData);
        const restored = restoreHistory(jsonData);
        currentIndex = 0;
        renderQuestion();
        if (restored > 0) {
            alert('题库导入成功，共 ' + questionData.length + ' 题，已还原 ' + restored + ' 题的解析笔记与做题记录。');
        }
    }

    // 从导出表的「我的答案 / 解析笔记 / 是否收藏 / 是否错题 / 答题状态」还原记录
    function restoreHistory(jsonData) {
        let restored = 0;
        jsonData.forEach((row, index) => {
            let hit = false;

            const note = row['解析笔记'] !== undefined ? row['解析笔记']
                       : (row['笔记'] !== undefined ? row['笔记'] : row['解析']);
            if (note !== undefined && note !== null && String(note).trim() !== '') {
                userNotes[index] = String(note);
                hit = true;
            }

            const fav = String(row['是否收藏'] || '').trim();
            if (fav === '是' || fav === 'Y' || fav === 'TRUE' || fav === 'true') {
                favorites.add(index);
                hit = true;
            }

            const picked = extractKeys(row['我的答案'] || '');

            const status = String(row['答题状态'] || '').trim();
            const isWrong = String(row['是否错题'] || '').trim() === '是';

            if (status === '正确') {
                userAnswers[index] = picked.length ? picked : normalizeAns(questionData[index].answer).split('');
                markSubmitted(index, true);
                hit = true;
            } else if (status === '错误') {
                userAnswers[index] = picked;
                markSubmitted(index, false);
                hit = true;
            } else if (picked.length) {
                userAnswers[index] = picked;
                if (isWrong) markSubmitted(index, false);
                hit = true;
            } else if (isWrong) {
                userAnswers[index] = [];
                markSubmitted(index, false);
                hit = true;
            }

            if (hit) restored++;
        });
        return restored;
    }

    // ===== 判断题答案归一化 =====
    const TRUE_WORDS = ['对', '正确', '是的', '是', '真', '√', '✓', 'T', 'TRUE', 'YES', 'Y', 'A'];
    const FALSE_WORDS = ['错', '错误', '不对', '否', '假', '×', 'X', '✗', 'F', 'FALSE', 'NO', 'N', 'B'];

    // 将判断题答案（正确/错误/对/错/√/×/T/F...）转成 A / B
    function judgeToKey(raw) {
        let s = String(raw === undefined || raw === null ? '' : raw).trim();
        if (!s) return '';
        s = s.replace(/[。.\s、,，:：!！]/g, '').toUpperCase();
        if (!s) return '';
        for (let i = 0; i < FALSE_WORDS.length; i++) {
            if (s === FALSE_WORDS[i]) return 'B';
        }
        for (let i = 0; i < TRUE_WORDS.length; i++) {
            if (s === TRUE_WORDS[i]) return 'A';
        }
        // 含"错/误/X/F"字样优先判为错误，避免"错误"被判成正确
        if (/错|误|NO|FALSE|^F$|×|✗/.test(s)) return 'B';
        if (/对|正|√|✓|YES|TRUE|^T$/.test(s)) return 'A';
        return '';
    }

    // 判断题固定选项
    const JUDGE_OPTIONS = [
        { key: 'A', val: '正确' },
        { key: 'B', val: '错误' }
    ];

    function isJudgeType(type) {
        return String(type || '').indexOf('判断') !== -1;
    }

    // 从答案文本中提取选项字母：兼容 "A"、"ABD"、"A、B、D"、"A. 正确"、"A. 甲 B. 乙"
    function extractKeys(raw) {
        const s = String(raw === undefined || raw === null ? '' : raw).trim();
        if (!s) return [];
        const hits = [];
        const re = /(?:^|[\s、,，\/])([A-H])(?![A-Za-z])/g;
        let m;
        while ((m = re.exec(s)) !== null) {
            if (hits.indexOf(m[1]) === -1) hits.push(m[1]);
        }
        if (hits.length) return hits.sort();
        const bare = s.replace(/[、,，\s\/]/g, '').toUpperCase();
        if (/^[A-H]+$/.test(bare)) return bare.split('');
        return [];
    }

    // 归一化答案：能识别出选项字母就用字母，否则保留原文（交给判断题归一化）
    function cleanAnswerText(raw) {
        const s = String(raw === undefined || raw === null ? '' : raw).trim();
        if (!s) return '';
        const keys = extractKeys(s);
        if (keys.length) return keys.join('');
        return s;
    }

    // 标准化字段
    function processQuestionData(data) {
        questionData = data.map((item, index) => {
            const typeRaw = item['题型'] || item['类型'] || '单选';
            const options = [];
            OPTION_KEYS.forEach(key => {
                const val = item['选项' + key] || item[key];
                if (val !== undefined && val !== null && String(val).trim() !== '') {
                    options.push({ key: key, val: String(val).trim() });
                }
            });

            let answerRaw = cleanAnswerText(item['答案'] || item['正确答案'] || '');
            let answer = answerRaw;
            let answerDisplay = answerRaw;

            // 判断题：无选项时自动生成"正确/错误"两个选项，并把答案文字转成 A/B
            if (isJudgeType(typeRaw) && options.length === 0) {
                const key = judgeToKey(answerRaw);
                answer = key;
                answerDisplay = key === 'A' ? 'A. 正确' : (key === 'B' ? 'B. 错误' : answerRaw);
                options.push({ key: 'A', val: '正确' }, { key: 'B', val: '错误' });
            }

            return {
                id: index,
                type: typeRaw,
                question: item['题干'] || item['题目'] || '',
                options: options,
                answer: answer,
                answerDisplay: answerDisplay,
                analysis: item['解析'] || item['解析笔记'] || item['笔记'] || ''
            };
        });
    }

    // 答案比对（忽略顿号/逗号/空格差异，多选与顺序无关）
    function normalizeAns(s) {
        return String(s || '').replace(/[、,，\s\/]/g, '').split('').sort().join('');
    }

    function isAnswered(idx) {
        return Object.prototype.hasOwnProperty.call(userAnswers, '__submitted_' + idx);
    }

    function markSubmitted(idx, isCorrect) {
        userAnswers['__submitted_' + idx] = true;
        if (isCorrect) {
            correctQuestions.add(idx);
            wrongQuestions.delete(idx);
        } else {
            wrongQuestions.add(idx);
            correctQuestions.delete(idx);
        }
    }

    // ===== 渲染当前题目 =====
    function renderQuestion() {
        if (!questionData.length) return;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex > questionData.length - 1) currentIndex = questionData.length - 1;

        const q = questionData[currentIndex];
        const submitted = isAnswered(currentIndex);

        progressText.innerText = '第 ' + (currentIndex + 1) + ' / ' + questionData.length + ' 题';
        document.getElementById('tagType').innerText = q.type;

        const isWrong = wrongQuestions.has(currentIndex);
        const isFav = favorites.has(currentIndex);
        document.getElementById('tagWrong').style.display = isWrong ? 'inline-block' : 'none';
        document.getElementById('tagFav').style.display = isFav ? 'inline-block' : 'none';

        const btnFav = document.getElementById('btnFav');
        btnFav.innerText = isFav ? '已收藏' : '收藏';
        btnFav.classList.toggle('active', isFav);

        // 题干（固定高度区域）
        const qBox = document.getElementById('questionText');
        renderMathInto(qBox, (currentIndex + 1) + '. ' + q.question);
        qBox.scrollTop = 0;

        // 渲染选项
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';
        optionsList.scrollTop = 0;

        const isMulti = String(q.type).indexOf('多选') !== -1;
        const inputType = isMulti ? 'checkbox' : 'radio';
        const prevSelection = userAnswers[currentIndex] || [];
        const correctKeys = normalizeAns(q.answer).split('');

        if (q.options.length === 0) {
            const tip = document.createElement('li');
            tip.className = 'option-item locked';
            tip.style.color = '#999';
            tip.innerText = '（本题无选项，请在笔记区记录答案）';
            optionsList.appendChild(tip);
        }

        q.options.forEach(opt => {
            const li = document.createElement('li');
            li.className = 'option-item';
            if (prevSelection.indexOf(opt.key) !== -1) li.classList.add('selected');

            const input = document.createElement('input');
            input.type = inputType;
            input.name = 'currentOption';
            input.value = opt.key;
            input.checked = prevSelection.indexOf(opt.key) !== -1;
            input.disabled = submitted;

            if (submitted) {
                // 已提交：正确项绿色；用户错选的项红色
                const picked = prevSelection.indexOf(opt.key) !== -1;
                const isRight = correctKeys.indexOf(opt.key) !== -1;
                li.classList.add('locked');
                li.classList.remove('selected');
                if (isRight) li.classList.add('correct');
                else if (picked) li.classList.add('wrong');
            }

            input.onchange = () => {
                if (submitted) return;
                handleOptionSelect(opt.key, isMulti);
                if (!isMulti) submitAnswer();
            };

            li.appendChild(input);
            const span = document.createElement('span');
            renderMathInto(span, opt.key + '. ' + opt.val);
            li.appendChild(span);

            li.onclick = (e) => {
                if (submitted) return;
                if (e.target !== input) {
                    input.checked = !input.checked;
                    input.onchange();
                }
            };

            optionsList.appendChild(li);
        });

        // 解析框与提交按钮
        const analysisBox = document.getElementById('analysisBox');
        const noteInput = document.getElementById('noteInput');
        const btnSubmit = document.getElementById('btnSubmit');

        if (submitted) {
            analysisBox.classList.add('show');
            btnSubmit.style.display = 'none';
            renderMathInto(document.getElementById('correctAnswerDisplay'), q.answerDisplay || q.answer);
        } else {
            analysisBox.classList.remove('show');
            btnSubmit.style.display = 'inline-block';
        }

        noteInput.value = userNotes[currentIndex] || q.analysis;
        renderNotePreview();

        // 导航按钮可用状态
        btnPrev.disabled = currentIndex <= 0;
        btnNext.disabled = currentIndex >= questionData.length - 1;

        // 题号浮窗若打开则同步刷新颜色
        if (navPopover.classList.contains('show')) buildNumGrid();
    }

    // 处理选项选择
    function handleOptionSelect(key, isMulti) {
        let current = (userAnswers[currentIndex] || []).slice();

        if (isMulti) {
            if (current.indexOf(key) !== -1) {
                current = current.filter(k => k !== key);
            } else {
                current.push(key);
            }
        } else {
            current = [key];
        }
        current.sort();
        userAnswers[currentIndex] = current;

        const inputs = document.querySelectorAll('input[name="currentOption"]');
        inputs.forEach(input => {
            input.parentElement.classList.toggle('selected', current.indexOf(input.value) !== -1);
        });
    }

    document.getElementById('btnSubmit').addEventListener('click', submitAnswer);

    function submitAnswer() {
        const q = questionData[currentIndex];
        const userAns = (userAnswers[currentIndex] || []).join('');
        const cleanCorrect = normalizeAns(q.answer);
        const cleanUser = normalizeAns(userAns);
        const isCorrect = cleanUser !== '' && cleanUser === cleanCorrect;

        markSubmitted(currentIndex, isCorrect);
        renderQuestion(); // 重绘：上色 + 锁定 + 显示解析
    }

    // 收藏
    document.getElementById('btnFav').addEventListener('click', () => {
        if (favorites.has(currentIndex)) favorites.delete(currentIndex);
        else favorites.add(currentIndex);
        renderQuestion();
    });

    // ===== LaTeX 公式渲染（KaTeX，多 CDN 自动降级 + 内置定界符解析）=====
    const notePreview = document.getElementById('notePreview');
    const formulaTip = document.getElementById('formulaTip');
    const KATEX_VERSION = '0.16.9';
    // 依次尝试：jsdelivr -> unpkg -> cdnjs -> bootcdn（国内镜像）
    const KATEX_BASES = [
        'https://cdn.jsdelivr.net/npm/katex@' + KATEX_VERSION + '/dist/',
        'https://unpkg.com/katex@' + KATEX_VERSION + '/dist/',
        'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/' + KATEX_VERSION + '/',
        'https://cdn.bootcdn.net/ajax/libs/KaTeX/' + KATEX_VERSION + '/'
    ];
    let katexReady = false;
    let previewTimer = null;

    function loadScript(url) {
        return new Promise(function (resolve, reject) {
            const s = document.createElement('script');
            s.src = url;
            s.async = true;
            s.onload = function () { resolve(); };
            s.onerror = function () { s.parentNode && s.parentNode.removeChild(s); reject(new Error('load fail')); };
            document.head.appendChild(s);
        });
    }

    // 不依赖官方 auto-render 插件：自行按定界符切分，只用 katex.renderToString
    const MATH_PATTERNS = [
        { re: /\$\$([\s\S]+?)\$\$/g, display: true },
        { re: /\\\[([\s\S]+?)\\\]/g, display: true },
        { re: /\\\(([\s\S]+?)\\\)/g, display: false },
        { re: /\$([^\s$](?:[^$\n]*[^\s$])?)\$/g, display: false }
    ];

    function renderMathInto(el, text) {
        if (!el) return;
        let str = (text === undefined || text === null) ? '' : String(text);
        if (!str) { el.textContent = ''; return; }
        // \$ 是转义的美元符号：先占位保护，输出时还原，避免与公式定界符混淆
        str = str.replace(/\\\$/g, '\uE000');
        if (!katexReady || typeof window.katex !== 'object' || !window.katex.renderToString) {
            el.textContent = str; // 公式库未就绪时退回纯文本，加载完成后自动重渲染
            return;
        }
        const spans = [];
        MATH_PATTERNS.forEach(function (p) {
            p.re.lastIndex = 0;
            let m;
            while ((m = p.re.exec(str)) !== null) {
                spans.push({ start: m.index, end: m.index + m[0].length, tex: m[1], display: p.display });
            }
        });
        spans.sort(function (a, b) { return a.start - b.start; });
        const picked = [];
        let cursor = -1;
        spans.forEach(function (s) {
            if (s.start >= cursor) { picked.push(s); cursor = s.end; }
        });
        if (!picked.length) { el.textContent = str.replace(/\uE000/g, '$'); return; }
        el.textContent = '';
        let pos = 0;
        picked.forEach(function (s) {
            if (s.start > pos) el.appendChild(document.createTextNode(str.slice(pos, s.start).replace(/\uE000/g, '$')));
            let node;
            try {
                const html = window.katex.renderToString(s.tex.replace(/\\\$/g, '$'), {
                    displayMode: s.display,
                    throwOnError: false,
                    errorColor: '#c0392b',
                    strict: 'ignore',
                    output: 'html'
                });
                const box = document.createElement(s.display ? 'div' : 'span');
                box.innerHTML = html;
                node = box;
            } catch (err) {
                node = document.createElement('span');
                node.className = 'math-error';
                node.textContent = str.slice(s.start, s.end); // 语法有误的公式：标红保留原文
            }
            el.appendChild(node);
            pos = s.end;
        });
        if (pos < str.length) el.appendChild(document.createTextNode(str.slice(pos).replace(/\uE000/g, '$')));
    }

    function renderNotePreview() {
        if (!notePreview) return;
        const text = document.getElementById('noteInput').value || '';
        renderMathInto(notePreview, text);
    }

    function setFormulaTip(msg) {
        if (formulaTip) formulaTip.textContent = msg || '';
    }

    // 逐个 CDN 尝试加载 katex 主库，成功后重绘当前题目
    (function loadKatex(i) {
        if (i >= KATEX_BASES.length) {
            setFormulaTip('公式渲染组件未能加载，公式将以原始 LaTeX 文本显示（联网后刷新即可自动渲染）。');
            return;
        }
        loadScript(KATEX_BASES[i] + 'katex.min.js').then(function () {
            if (typeof window.katex !== 'object') { loadKatex(i + 1); return; }
            katexReady = true;
            setFormulaTip('');
            if (questionData.length) renderQuestion(); else renderNotePreview();
        }).catch(function () { loadKatex(i + 1); });
    })(0);

    // 输入时防抖渲染，避免频繁重排；不改变输入焦点
    function scheduleNotePreview() {
        if (previewTimer) clearTimeout(previewTimer);
        previewTimer = setTimeout(renderNotePreview, 250);
    }

    // 笔记
    document.getElementById('noteInput').addEventListener('input', (e) => {
        userNotes[currentIndex] = e.target.value;
        scheduleNotePreview();
    });

    // 笔记编辑期间空格只用于输入文字，不触发切题/提交
    document.getElementById('noteInput').addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Spacebar') {
            e.stopPropagation();
        }
    });

    // ===== 导航 =====
    function goPrev() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    function goNext() {
        if (currentIndex < questionData.length - 1) {
            currentIndex++;
            renderQuestion();
        }
    }

    btnPrev.addEventListener('click', goPrev);
    btnNext.addEventListener('click', goNext);

    // 空格键逻辑：未提交时，多选题先提交答案；单选/判断直接下一题；
    // 已显示答案状态下，空格跳到下一题。
    function handleSpace() {
        if (!questionData.length) return;
        if (isAnswered(currentIndex)) {
            goNext();
            return;
        }
        const q = questionData[currentIndex];
        const isMulti = String(q.type).indexOf('多选') !== -1;
        if (isMulti) {
            submitAnswer();
        } else {
            goNext();
        }
    }

    // 键盘方向键切题：左右箭头 + 上下箭头（输入框内不拦截）
    document.addEventListener('keydown', (e) => {
        if (quizSection.style.display === 'none' || !questionData.length) return;
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        if (tag === 'textarea' || (tag === 'input' && e.target.type === 'text')) return;

        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            goPrev();
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            goNext();
        } else if (e.key === ' ' || e.key === 'Spacebar') {
            // 空格键：避免触发聚焦按钮/复选框的默认行为
            e.preventDefault();
            handleSpace();
        } else if (e.key === 'Escape') {
            closePopover();
        }
    });

    // ===== 题号浮窗 =====
    function buildNumGrid() {
        numGrid.innerHTML = '';
        questionData.forEach((q, i) => {
            const cell = document.createElement('button');
            cell.type = 'button';
            cell.className = 'num-cell';
            cell.innerText = i + 1;
            cell.title = '第 ' + (i + 1) + ' 题';
            if (correctQuestions.has(i)) cell.classList.add('correct');
            else if (wrongQuestions.has(i)) cell.classList.add('wrong');
            if (i === currentIndex) cell.classList.add('current');

            cell.addEventListener('click', () => {
                currentIndex = i;
                renderQuestion();
                closePopover();
            });
            numGrid.appendChild(cell);
        });

        // 自动滚动到当前题
        const cur = numGrid.children[currentIndex];
        if (cur && cur.scrollIntoView) {
            cur.scrollIntoView({ block: 'nearest' });
        }
    }

    function openPopover() {
        buildNumGrid();
        navPopover.classList.add('show');
    }

    function closePopover() {
        navPopover.classList.remove('show');
    }

    progressText.addEventListener('click', (e) => {
        e.stopPropagation();
        if (navPopover.classList.contains('show')) closePopover();
        else openPopover();
    });

    navPopover.addEventListener('click', (e) => e.stopPropagation());

    document.addEventListener('click', () => closePopover());

    // 页面资源就绪后补渲染一次，确保 CDN 较晚加载完成时公式也能显示
    window.addEventListener('load', function () {
        if (questionData.length) renderQuestion(); else renderNotePreview();
    });

    // ===== 导出 =====
    document.getElementById('btnExportTop').addEventListener('click', exportData);

    function optionValText(q, key) {
        const hit = q.options.filter(o => o.key === key)[0];
        return hit ? hit.val : '';
    }

    function exportData() {
        const exportList = questionData.map((q, index) => {
            const row = {
                '序号': index + 1,
                '题型': q.type,
                '题干': q.question
            };
            for (let i = 0; i < OPTION_KEYS.length; i++) {
                const k = OPTION_KEYS[i];
                row['选项' + k] = optionValText(q, k);
            }
            row['答案'] = q.answerDisplay || q.answer;
            const mine = (userAnswers[index] || []).slice();
            row['我的答案'] = mine.length ? mine.map(k => k + '.' + optionValText(q, k)).join(' ') : '';
            row['解析笔记'] = userNotes[index] || q.analysis;
            row['是否收藏'] = favorites.has(index) ? '是' : '否';
            row['是否错题'] = wrongQuestions.has(index) ? '是' : '否';
            row['答题状态'] = isAnswered(index) ? (correctQuestions.has(index) ? '正确' : '错误') : '未做';
            return row;
        });

        const ws = XLSX.utils.json_to_sheet(exportList);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '导出题库');
        XLSX.writeFile(wb, '我的答题笔记.xlsx');
    }
</script>

</body>
